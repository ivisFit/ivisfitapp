  <g class="doodle" transform="translate(360,300) rotate(18)">
    <path d="M4 14 L16 8 L28 14 L16 20 Z"/>
    <rect x="14" y="20" width="4" height="6"/>
    <path d="M18 26 L24 24"/>
  </g>
  <!-- Coaching whistle -->
  <g class="doodle" transform="translate(195,340) rotate(14)">
    <path d="M8 10 C8 6 12 4 16 4 C20 4 24 6 24 10 L24 18 C24 22 20 24 16 24 C12 24 8 22 8 18 Z"/>
    <rect x="6" y="12" width="4" height="4" rx="1"/>
    <path d="M24 14 L28 14 L28 16 L24 16"/>
    <line x1="16" y1="4" x2="16" y2="0"/>
  </g>
  <!-- Small icons - fill gaps -->
  <g class="doodle" transform="translate(95,55) rotate(-25)">
    <circle cx="8" cy="8" r="6"/>
    <line x1="8" y1="2" x2="8" y2="14"/>
    <line x1="2" y1="8" x2="14" y2="8"/>
  </g>
  <g class="doodle" transform="translate(255,55) rotate(30)">
    <path d="M8 2 L14 14 L2 14 Z"/>
    <line x1="8" y1="14" x2="8" y2="20"/>
    <line x1="5" y1="20" x2="11" y2="20"/>
  </g>
  <g class="doodle" transform="translate(380,55) rotate(-12)">
    <rect x="4" y="4" width="16" height="20" rx="2"/>
    <line x1="8" y1="10" x2="16" y2="10"/>
    <line x1="8" y1="16" x2="14" y2="16"/>
  </g>
  <g class="doodle" transform="translate(75,165) rotate(20)">
    <path d="M4 20 L12 4 L20 20 Z"/>
    <line x1="8" y1="14" x2="16" y2="14"/>
  </g>
  <g class="doodle" transform="translate(355,220) rotate(6)">
    <circle cx="10" cy="10" r="8"/>
    <path d="M6 10 L10 6 L14 10 L10 14 Z"/>
  </g>
  <g class="doodle" transform="translate(15,350) rotate(-14)">
    <path d="M4 16 C4 8 16 4 16 4 C16 4 28 8 28 16"/>
    <line x1="8" y1="16" x2="24" y2="16"/>
  </g>
  <g class="doodle" transform="translate(115,350) rotate(8)">
    <ellipse cx="12" cy="14" rx="10" ry="12"/>
    <line x1="6" y1="8" x2="18" y2="8"/>
  </g>
  <!-- New elements for profe -->
  <!-- Timer -->
  <g class="doodle" transform="translate(275,20) rotate(-8)">
    <circle cx="16" cy="16" r="12"/>
    <line x1="16" y1="16" x2="16" y2="8"/>
    <line x1="16" y1="16" x2="22" y2="16"/>
    <circle cx="16" cy="16" r="2"/>
    <path d="M16 4 L16 2 L18 2 L18 4"/>
  </g>
  <!-- Coaching board -->
  <g class="doodle" transform="translate(50,250) rotate(15)">
    <rect x="4" y="4" width="24" height="32" rx="1"/>
    <line x1="8" y1="10" x2="24" y2="10"/>
    <line x1="8" y1="16" x2="24" y2="16"/>
    <line x1="8" y1="22" x2="24" y2="22"/>
    <line x1="8" y1="28" x2="24" y2="28"/>
    <circle cx="12" cy="10" r="1"/>
    <circle cx="20" cy="16" r="1"/>
    <circle cx="16" cy="22" r="1"/>
    <circle cx="12" cy="28" r="1"/>
  </g>
  <!-- Progress arrow -->
  <g class="doodle" transform="translate(320,320) rotate(-12)">
    <path d="M4 16 L24 16 M20 12 L24 16 L20 20"/>
    <circle cx="10" cy="16" r="2"/>
    <circle cx="16" cy="16" r="2"/>
  </g>

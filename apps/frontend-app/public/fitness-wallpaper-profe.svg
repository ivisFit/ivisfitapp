    <rect x="14" y="16" width="4" height="12"/>
    <rect x="20" y="12" width="4" height="16"/>
  </g>
  <!-- Pie chart -->
  <g class="doodle" transform="translate(55,290) rotate(-6)">
    <circle cx="16" cy="16" r="14"/>
    <path d="M16 16 L16 2 A14 14 0 0 1 28 16 Z"/>
    <path d="M16 16 L28 16 A14 14 0 0 1 16 30 Z"/>
    <path d="M16 16 L16 30 A14 14 0 0 1 2 16 Z"/>
  </g>
  <!-- Dumbbell -->
  <g class="doodle" transform="translate(175,275) rotate(10)">
    <rect x="2" y="10" width="6" height="14" rx="1"/>
    <rect x="34" y="10" width="6" height="14" rx="1"/>
    <line x1="8" y1="17" x2="34" y2="17"/>
  </g>
  <!-- Whiteboard -->
  <g class="doodle" transform="translate(285,280) rotate(-20)">
    <rect x="4" y="4" width="24" height="32" rx="1"/>
    <line x1="8" y1="10" x2="24" y2="10"/>
    <line x1="8" y1="16" x2="20" y2="16"/>
    <line x1="8" y1="22" x2="22" y2="22"/>
    <line x1="8" y1="28" x2="18" y2="28"/>
    <rect x="12" y="0" width="8" height="4"/>
  </g>
  <!-- Book -->
  <g class="doodle" transform="translate(355,115) rotate(-5)">
    <path d="M8 6 L8 28 L24 28 L24 6 C24 6 16 4 16 4 C16 4 8 6 8 6"/>
    <line x1="16" y1="4" x2="16" y2="28"/>
    <line x1="8" y1="12" x2="24" y2="12"/>
    <line x1="8" y1="18" x2="24" y2="18"/>
    <line x1="8" y1="24" x2="24" y2="24"/>
  </g>

    <circle cx="16" cy="18" r="4"/>
  </g>
  <!-- Bar chart -->
  <g class="doodle" transform="translate(330,190) rotate(8)">
    <line x1="4" y1="28" x2="4" y2="8"/>
    <line x1="4" y1="28" x2="28" y2="28"/>

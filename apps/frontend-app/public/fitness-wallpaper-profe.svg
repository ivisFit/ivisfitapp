<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <defs>
    <style>
      .doodle { stroke: #f5c518; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.11; fill: none; }
    </style>
  </defs>
  <!-- Clipboard with checklist -->
  <g class="doodle" transform="translate(28,32) rotate(-12)">
    <rect x="6" y="4" width="24" height="32" rx="2"/>
    <line x1="10" y1="10" x2="26" y2="10"/>
    <line x1="10" y1="16" x2="26" y2="16"/>
    <line x1="10" y1="22" x2="26" y2="22"/>
    <line x1="10" y1="28" x2="20" y2="28"/>
    <circle cx="14" cy="10" r="1"/>
    <circle cx="14" cy="16" r="1"/>
    <circle cx="14" cy="22" r="1"/>
    <circle cx="14" cy="28" r="1"/>
  </g>
  <!-- Whistle -->
  <g class="doodle" transform="translate(120,18) rotate(8)">
    <path d="M8 12 C8 8 12 6 16 6 C20 6 24 8 24 12 L24 20 C24 24 20 26 16 26 C12 26 8 24 8 20 Z"/>
    <rect x="6" y="14" width="4" height="4" rx="1"/>
    <path d="M24 16 L28 16 L28 18 L24 18"/>
  </g>
  <!-- Stopwatch -->
  <g class="doodle" transform="translate(220,28) rotate(-18)">
    <circle cx="16" cy="18" r="14"/>
    <line x1="16" y1="4" x2="16" y2="0"/>
    <line x1="16" y1="18" x2="16" y2="10"/>
    <line x1="16" y1="18" x2="22" y2="18"/>
    <rect x="12" y="-2" width="8" height="3" rx="1"/>
  </g>
  <!-- Tablet with chart -->
  <g class="doodle" transform="translate(320,24) rotate(15)">
    <rect x="4" y="6" width="24" height="32" rx="2"/>
    <line x1="8" y1="12" x2="24" y2="12"/>
    <line x1="8" y1="18" x2="20" y2="18"/>
    <line x1="8" y1="24" x2="22" y2="24"/>
    <line x1="8" y1="30" x2="18" y2="30"/>
    <circle cx="16" cy="34" r="2"/>
  </g>
  <!-- Presentation pointer -->
  <g class="doodle" transform="translate(48,110) rotate(6)">
    <line x1="16" y1="4" x2="16" y2="28"/>
    <circle cx="16" cy="30" r="2"/>

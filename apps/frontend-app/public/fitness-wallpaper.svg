<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <defs>
    <style>
      .doodle { stroke: #f5c518; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.11; fill: none; }
    </style>
  </defs>
  <!-- Dumbbell -->
  <g class="doodle" transform="translate(28,32) rotate(-12)">
    <rect x="2" y="10" width="6" height="14" rx="1"/>
    <rect x="34" y="10" width="6" height="14" rx="1"/>
    <line x1="8" y1="17" x2="34" y2="17"/>
  </g>
  <!-- Kettlebell -->
  <g class="doodle" transform="translate(120,18) rotate(8)">
    <path d="M14 4 C14 4 10 8 10 14 C10 22 18 26 18 26 C18 26 26 22 26 14 C26 8 22 4 22 4"/>
    <path d="M12 4 L24 4"/>
    <ellipse cx="18" cy="30" rx="12" ry="10"/>
  </g>
  <!-- Running shoe -->
  <g class="doodle" transform="translate(220,28) rotate(-18)">
    <path d="M4 18 L28 18 L32 14 L36 14 L38 20 L8 24 Z"/>
    <line x1="12" y1="18" x2="12" y2="22"/>
    <line x1="20" y1="18" x2="20" y2="22"/>
    <line x1="28" y1="18" x2="28" y2="21"/>
  </g>
  <!-- Water bottle -->
  <g class="doodle" transform="translate(320,24) rotate(15)">
    <rect x="10" y="8" width="12" height="4" rx="1"/>
    <path d="M8 12 L24 12 L22 36 L10 36 Z"/>
    <line x1="12" y1="20" x2="20" y2="20"/>
  </g>
  <!-- Heart rate -->
  <g class="doodle" transform="translate(48,110) rotate(6)">
    <path d="M16 8 C10 2 2 6 2 14 C2 22 16 30 16 30 C16 30 30 22 30 14 C30 6 22 2 16 8 Z"/>
    <polyline points="6,18 10,14 14,20 18,12 22,16"/>
  </g>
  <!-- Stopwatch -->
  <g class="doodle" transform="translate(168,95) rotate(-10)">
    <circle cx="16" cy="18" r="14"/>
    <line x1="16" y1="4" x2="16" y2="0"/>
    <line x1="16" y1="18" x2="16" y2="10"/>
    <line x1="16" y1="18" x2="22" y2="18"/>
    <rect x="12" y="-2" width="8" height="3" rx="1"/>
  </g>
  <!-- Barbell plate -->
  <g class="doodle" transform="translate(290,100) rotate(22)">
    <circle cx="16" cy="16" r="14"/>
    <circle cx="16" cy="16" r="5"/>
    <line x1="2" y1="16" x2="30" y2="16"/>
  </g>
  <!-- Jump rope -->
  <g class="doodle" transform="translate(18,200) rotate(-8)">
    <path d="M4 4 C20 4 28 20 28 36"/>
    <path d="M36 4 C20 4 12 20 12 36"/>
    <line x1="4" y1="4" x2="8" y2="8"/>
    <line x1="36" y1="4" x2="32" y2="8"/>
  </g>
  <!-- Yoga pose -->
  <g class="doodle" transform="translate(130,185) rotate(12)">
    <circle cx="16" cy="6" r="4"/>
    <path d="M16 10 L16 22 M10 16 L22 16 M8 28 L16 22 L24 28"/>
  </g>
  <!-- Flame / calories -->
  <g class="doodle" transform="translate(235,195) rotate(-15)">
    <path d="M16 4 C12 12 8 14 8 22 C8 28 12 32 16 32 C20 32 24 28 24 22 C24 14 20 12 16 4 Z"/>
    <path d="M16 14 C14 18 14 22 16 26 C18 22 18 18 16 14 Z"/>
  </g>
  <!-- Bicycle -->
  <g class="doodle" transform="translate(330,190) rotate(8)">
    <circle cx="10" cy="24" r="8"/>
    <circle cx="30" cy="24" r="8"/>
    <path d="M10 24 L18 12 L26 12 L30 24"/>
    <line x1="18" y1="12" x2="14" y2="24"/>
  </g>
  <!-- Protein shaker -->
  <g class="doodle" transform="translate(55,290) rotate(-6)">
    <path d="M10 6 L22 6 L24 10 L20 34 L12 34 L8 10 Z"/>
    <line x1="12" y1="14" x2="20" y2="14"/>
    <line x1="13" y1="20" x2="19" y2="20"/>
  </g>
  <!-- Trophy -->
  <g class="doodle" transform="translate(175,275) rotate(10)">
    <path d="M8 8 L24 8 L22 20 C22 26 18 28 16 28 C14 28 10 26 10 20 Z"/>
    <path d="M6 8 C4 8 2 10 2 12 C2 14 4 16 6 16"/>
    <path d="M26 8 C28 8 30 10 30 12 C30 14 28 16 26 16"/>
    <line x1="12" y1="28" x2="12" y2="32"/>
    <line x1="20" y1="28" x2="20" y2="32"/>
    <line x1="10" y1="32" x2="22" y2="32"/>
  </g>
  <!-- Measuring tape -->
  <g class="doodle" transform="translate(285,280) rotate(-20)">
    <ellipse cx="16" cy="16" rx="14" ry="10"/>
    <line x1="6" y1="16" x2="26" y2="16"/>
    <line x1="10" y1="12" x2="10" y2="20"/>
    <line x1="16" y1="11" x2="16" y2="21"/>
    <line x1="22" y1="12" x2="22" y2="20"/>
  </g>
  <!-- Pull-up bar -->
  <g class="doodle" transform="translate(355,115) rotate(-5)">
    <line x1="4" y1="8" x2="36" y2="8"/>
    <line x1="8" y1="8" x2="8" y2="20"/>
    <line x1="32" y1="8" x2="32" y2="20"/>
    <path d="M14 8 C14 8 14 16 18 20 C22 16 22 8 22 8"/>
  </g>
  <!-- Sneaker (second) -->
  <g class="doodle" transform="translate(360,300) rotate(18)">
    <path d="M4 14 L24 14 L28 10 L32 10 L34 18 L6 20 Z"/>
  </g>
  <!-- Dumbbell (offset tile) -->
  <g class="doodle" transform="translate(195,340) rotate(14)">
    <rect x="2" y="10" width="6" height="14" rx="1"/>
    <rect x="34" y="10" width="6" height="14" rx="1"/>
    <line x1="8" y1="17" x2="34" y2="17"/>
  </g>
  <!-- Small icons - fill gaps -->
  <g class="doodle" transform="translate(95,55) rotate(-25)">
    <circle cx="8" cy="8" r="6"/>
    <line x1="8" y1="2" x2="8" y2="14"/>
    <line x1="2" y1="8" x2="14" y2="8"/>
  </g>
  <g class="doodle" transform="translate(255,55) rotate(30)">
    <path d="M8 2 L14 14 L2 14 Z"/>
    <line x1="8" y1="14" x2="8" y2="20"/>
    <line x1="5" y1="20" x2="11" y2="20"/>
  </g>
  <g class="doodle" transform="translate(380,55) rotate(-12)">
    <rect x="4" y="4" width="16" height="20" rx="2"/>
    <line x1="8" y1="10" x2="16" y2="10"/>
    <line x1="8" y1="16" x2="14" y2="16"/>
  </g>
  <g class="doodle" transform="translate(75,165) rotate(20)">
    <path d="M4 20 L12 4 L20 20 Z"/>
    <line x1="8" y1="14" x2="16" y2="14"/>
  </g>
  <g class="doodle" transform="translate(355,220) rotate(6)">
    <circle cx="10" cy="10" r="8"/>
    <path d="M6 10 L10 6 L14 10 L10 14 Z"/>
  </g>
  <g class="doodle" transform="translate(15,350) rotate(-14)">
    <path d="M4 16 C4 8 16 4 16 4 C16 4 28 8 28 16"/>
    <line x1="8" y1="16" x2="24" y2="16"/>
  </g>
  <g class="doodle" transform="translate(115,350) rotate(8)">
    <ellipse cx="12" cy="14" rx="10" ry="12"/>
    <line x1="6" y1="8" x2="18" y2="8"/>
  </g>
</svg>
